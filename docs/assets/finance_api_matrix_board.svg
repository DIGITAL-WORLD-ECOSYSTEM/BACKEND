      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>

    <linearGradient id="quadCard" x1="0%" y1="0%" x2="0%" y2="100%">
