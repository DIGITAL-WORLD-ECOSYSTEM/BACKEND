  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #F1F5F9; }
    .quad-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
    .route-text { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", Menlo, monospace; font-size: 11.5px; font-weight: 700; fill: #E2E8F0; }
    .badge-get { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 9px; font-weight: 800; fill: #38BDF8; letter-spacing: 0.5px; }
    .badge-post { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 9px; font-weight: 800; fill: #34D399; letter-spacing: 0.5px; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 8.5px; font-weight: 700; fill: #94A3B8; }
    .chip-text-accent { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 8.5px; font-weight: 700; fill: #FBBF24; }
  </style>

