<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 490" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #F1F5F9; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 700; fill: #64748B; letter-spacing: 1.2px; }
    .row-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; fill: #E2E8F0; }
    .route-text { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; fill: #38BDF8; }
    .badge-post { font-family: monospace; font-size: 9.5px; font-weight: 800; fill: #34D399; }
    .badge-get { font-family: monospace; font-size: 9.5px; font-weight: 800; fill: #60A5FA; }
  </style>

  <rect x="2" y="2" width="946" height="486" rx="14" fill="url(#bgGrad3)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="32" cy="30" r="6" fill="#EF4444"/>
  <circle cx="52" cy="30" r="6" fill="#F59E0B"/>
  <circle cx="72" cy="30" r="6" fill="#10B981"/>
  <text x="100" y="34" class="title">IDENTITY &amp; IAM CORE — MATRIZ OFICIAL DE ENDPOINTS (/api/v1/identity)</text>

  <!-- Table Headers -->
  <text x="35" y="75" class="col-header">MÉTODO</text>
  <text x="110" y="75" class="col-header">ROTA CANÔNICA</text>
  <text x="360" y="75" class="col-header">PROTEÇÃO / ASSURANCE</text>
  <text x="560" y="75" class="col-header">FINALIDADE &amp; REGRA DE NEGÓCIO</text>

  <line x1="25" y1="85" x2="925" y2="85" stroke="#334155" stroke-width="1"/>

  <!-- Rows -->
  <!-- 1. Register -->
  <rect x="25" y="93" width="900" height="28" rx="4" fill="#0F172A"/>
  <text x="35" y="112" class="badge-post">POST</text>
  <text x="110" y="112" class="route-text">/register</text>
  <text x="360" y="112" class="row-text">Pública • Rate Limit (5/m)</text>
  <text x="560" y="112" class="row-text">Cadastro inicial com PBKDF2 e perfil automático</text>

  <!-- 2. Login Local -->
  <rect x="25" y="125" width="900" height="28" rx="4" fill="#080C14"/>
  <text x="35" y="144" class="badge-post">POST</text>
  <text x="110" y="144" class="route-text">/login/local</text>
  <text x="360" y="144" class="row-text">Pública • Anti-Brute (10/m)</text>
  <text x="560" y="144" class="row-text">Login por senha; emite AAL1 ou solicita 2FA (AAL2)</text>

  <!-- 3. Web3 Challenge -->
  <rect x="25" y="157" width="900" height="28" rx="4" fill="#0F172A"/>
  <text x="35" y="176" class="badge-post">POST</text>
  <text x="110" y="176" class="route-text">/web3/challenge</text>
  <text x="360" y="176" class="row-text">Pública • Nonce Temporal</text>
  <text x="560" y="176" class="row-text">Geração de desafio SIWE EIP-4361 com TTL curto</text>

  <!-- 4. Login Web3 -->
  <rect x="25" y="189" width="900" height="28" rx="4" fill="#080C14"/>
  <text x="35" y="208" class="badge-post">POST</text>
  <text x="110" y="208" class="route-text">/login/web3</text>
  <text x="360" y="208" class="row-text">Validação Criptográfica EVM</text>
  <text x="560" y="208" class="row-text">Autenticação com carteira MetaMask/Rabby em AAL2</text>

  <!-- 5. Passkey Challenge -->
  <rect x="25" y="221" width="900" height="28" rx="4" fill="#0F172A"/>
  <text x="35" y="240" class="badge-post">POST</text>
  <text x="110" y="240" class="route-text">/login/passkey/challenge</text>
  <text x="360" y="240" class="row-text">Pública • WebAuthn Options</text>
  <text x="560" y="240" class="row-text">Opções de autenticação biométrica FIDO2</text>

  <!-- 6. Login Passkey -->
  <rect x="25" y="253" width="900" height="28" rx="4" fill="#080C14"/>
  <text x="35" y="272" class="badge-post">POST</text>
  <text x="110" y="272" class="route-text">/login/passkey</text>
  <text x="360" y="272" class="row-text">Verificação COSE de hardware</text>
  <text x="560" y="272" class="row-text">Login biométrico instantâneo em AAL2</text>

  <!-- 7. Passkey Register Verify -->
  <rect x="25" y="285" width="900" height="28" rx="4" fill="#0F172A"/>
  <text x="35" y="304" class="badge-post">POST</text>
  <text x="110" y="304" class="route-text">/registration/passkey/verify</text>
  <text x="360" y="304" class="row-text">sessionGuard • AAL2 Required</text>
  <text x="560" y="304" class="row-text">Registro seguro de nova credencial Passkey no D1</text>

  <!-- 8. Get Me (Sessão / Perfil) -->
  <rect x="25" y="317" width="900" height="28" rx="4" fill="#080C14"/>
  <text x="35" y="336" class="badge-get">GET</text>
  <text x="110" y="336" class="route-text">/me</text>
  <text x="360" y="336" class="row-text">sessionGuard • Stateful D1</text>
  <text x="560" y="336" class="row-text">Retorna dados do usuário, perfil, roles e sessão viva</text>

  <!-- 9. Refresh Session -->
  <rect x="25" y="349" width="900" height="28" rx="4" fill="#0F172A"/>
  <text x="35" y="368" class="badge-post">POST</text>
  <text x="110" y="368" class="route-text">/refresh</text>
  <text x="360" y="368" class="row-text">Token Family Rotation</text>
  <text x="560" y="368" class="row-text">Renovação de Access Token injetando sid ativo</text>

  <!-- 10. TOTP Setup & Verify -->
  <rect x="25" y="381" width="900" height="28" rx="4" fill="#080C14"/>
  <text x="35" y="400" class="badge-post">POST</text>
  <text x="110" y="400" class="route-text">/totp/setup &amp; /verify</text>
  <text x="360" y="400" class="row-text">sessionGuard • AES-GCM Vault</text>
  <text x="560" y="400" class="row-text">Setup e confirmação de 2FA Google Authenticator</text>

  <!-- 11. External Identities -->
  <rect x="25" y="413" width="900" height="28" rx="4" fill="#0F172A"/>
  <text x="35" y="432" class="badge-get">GET</text>
  <text x="110" y="432" class="route-text">/external-identities</text>
  <text x="360" y="432" class="row-text">sessionGuard • D1 Query</text>
  <text x="560" y="432" class="row-text">Lista todas as carteiras e passkeys vinculadas</text>

  <!-- 12. Logout & Logout All -->
  <rect x="25" y="445" width="900" height="28" rx="4" fill="#080C14"/>
  <text x="35" y="464" class="badge-post">POST</text>
  <text x="110" y="464" class="route-text">/logout &amp; /logout-all</text>
  <text x="360" y="464" class="row-text">sessionGuard • Invalidação D1</text>
  <text x="560" y="464" class="row-text">Revogação atômica da sessão ou de toda a família</text>
</svg>