<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 390" width="100%" height="100%">
  <defs>
    <linearGradient id="layersBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>

    <linearGradient id="scoreCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>

    <linearGradient id="layerRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #F1F5F9; }
    .score-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; fill: #64748B; }
    .score-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 42px; font-weight: 900; fill: #10B981; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; fill: #94A3B8; font-weight: 600; }
    .layer-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-weight: 700; fill: #E2E8F0; }
    .layer-count { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace; font-size: 10px; fill: #64748B; font-weight: 600; }
    .layer-score { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace; font-size: 11px; font-weight: 800; fill: #38BDF8; }
    .frozen-badge { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 9px; font-weight: 800; fill: #34D399; letter-spacing: 0.5px; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="946" height="386" rx="14" fill="url(#layersBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <circle cx="32" cy="30" r="6" fill="#EF4444"/>
  <circle cx="52" cy="30" r="6" fill="#F59E0B"/>
  <circle cx="72" cy="30" r="6" fill="#10B981"/>
  <text x="100" y="34" class="title">ASPPIBRA ECOSYSTEM — ARCHITECTURAL LAYERS &amp; AUDIT MATRIX</text>

  <!-- Status Pill -->
  <rect x="760" y="18" width="160" height="25" rx="12.5" fill="#064E3B" stroke="#059669" stroke-width="1.2"/>
  <circle cx="778" cy="30.5" r="4" fill="#34D399"/>
  <text x="792" y="34" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="800" fill="#6EE7B7" letter-spacing="1px">84/84 CERTIFIED</text>

  <!-- Separator -->
  <line x1="20" y1="56" x2="930" y2="56" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= LEFT: EXECUTIVE COMPLIANCE CARD ================= -->
  <rect x="30" y="75" width="280" height="255" rx="10" fill="url(#scoreCard)" stroke="#1E293B" stroke-width="1.2"/>
  
  <text x="50" y="102" class="score-label">OVERALL AUDIT SCORE</text>
  <text x="50" y="148" class="score-val">9.98<tspan font-size="18" fill="#64748B" font-weight="600"> / 10</tspan></text>

  <line x1="50" y1="165" x2="290" y2="165" stroke="#1E293B" stroke-width="1"/>

  <!-- Sub Metrics -->
  <g transform="translate(50, 185)">
    <circle cx="4" cy="4" r="3" fill="#10B981"/>
    <text x="16" y="7" class="metric-sub">Certified Files: <tspan fill="#F8FAFC" font-weight="700">84 / 84 (100%)</tspan></text>
  </g>
  <g transform="translate(50, 215)">
    <circle cx="4" cy="4" r="3" fill="#38BDF8"/>
    <text x="16" y="7" class="metric-sub">Vitest Suite: <tspan fill="#F8FAFC" font-weight="700">394 Passed (100%)</tspan></text>
  </g>
  <g transform="translate(50, 245)">
    <circle cx="4" cy="4" r="3" fill="#F59E0B"/>
    <text x="16" y="7" class="metric-sub">Precision: <tspan fill="#F8FAFC" font-weight="700">256-bit uint256 Math</tspan></text>
  </g>
  <g transform="translate(50, 275)">
    <circle cx="4" cy="4" r="3" fill="#A855F7"/>
    <text x="16" y="7" class="metric-sub">Production Status: <tspan fill="#F8FAFC" font-weight="700">Cloudflare Workers</tspan></text>
  </g>
  <g transform="translate(50, 305)">
    <circle cx="4" cy="4" r="3" fill="#06B6D4"/>
    <text x="16" y="7" class="metric-sub">Schema Drift: <tspan fill="#34D399" font-weight="700">Zero Detected (PASS)</tspan></text>
  </g>

