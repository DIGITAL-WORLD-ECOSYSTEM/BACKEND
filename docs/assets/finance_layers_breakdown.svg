    <text x="512" y="19" class="frozen-badge">🟢 FROZEN</text>
  </g>

  <!-- Layer 7 -->
  <g transform="translate(330, 297)">
    <rect x="0" y="0" width="590" height="32" rx="6" fill="url(#layerRow)" stroke="#1E293B" stroke-width="1"/>
    <text x="15" y="20" class="layer-name">Camada 7 — Suíte de Testes Automatizados</text>
    <text x="320" y="20" class="layer-count">30 Arquivos</text>
    <text x="430" y="20" class="layer-score">10,0 / 10</text>
    <rect x="500" y="7" width="75" height="18" rx="4" fill="#064E3B"/>
    <text x="512" y="19" class="frozen-badge">🟢 FROZEN</text>
  </g>

  <!-- Footer Info Line -->
