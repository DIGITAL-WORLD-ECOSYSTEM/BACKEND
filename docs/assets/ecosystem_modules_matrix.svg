  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #F1F5F9; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; font-weight: 800; letter-spacing: 1px; fill: #64748B; }
    .row-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11.5px; font-weight: 700; fill: #F1F5F9; }
    .row-tech { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; fill: #94A3B8; }
    .row-stat { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; fill: #38BDF8; }
    .score-badge { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 9px; font-weight: 800; fill: #34D399; }
    .active-badge { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 9px; font-weight: 800; fill: #38BDF8; }
