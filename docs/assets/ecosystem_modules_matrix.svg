    <text x="690" y="24" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12" font-weight="800" fill="#10B981">10,0 / 10</text>
    <rect x="800" y="10" width="75" height="18" rx="4" fill="#0C4A6E"/>
    <text x="812" y="22.5" class="active-badge">⚡ ACTIVE</text>
