<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>

    <linearGradient id="tierCard1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>

    <linearGradient id="tierCard2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131F3B"/>
      <stop offset="100%" stop-color="#0D162B"/>
    </linearGradient>

    <linearGradient id="tierCard3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181736"/>
      <stop offset="100%" stop-color="#0E1026"/>
    </linearGradient>

    <linearGradient id="tierCard4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1820"/>
      <stop offset="100%" stop-color="#10111A"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #F1F5F9; }
    .tier-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 700; fill: #F8FAFC; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10px; fill: #94A3B8; }
    .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 9.5px; font-weight: 600; fill: #64748B; letter-spacing: 0.5px; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="946" height="436" rx="14" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <circle cx="32" cy="30" r="6" fill="#EF4444"/>
  <circle cx="52" cy="30" r="6" fill="#F59E0B"/>
  <circle cx="72" cy="30" r="6" fill="#10B981"/>
  <text x="100" y="34" class="title">ASPPIBRA ECOSYSTEM — ARCHITECTURE TOPOLOGY &amp; DATA FLOW</text>

  <!-- Status Pill -->
  <rect x="760" y="18" width="160" height="25" rx="12.5" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
  <text x="785" y="34" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="800" fill="#A5B4FC" letter-spacing="1px">4-TIER PIPELINE</text>

  <!-- Separator -->
  <line x1="20" y1="56" x2="930" y2="56" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= TIER 1: EDGE & INGRESS ================= -->
  <rect x="30" y="75" width="200" height="310" rx="10" fill="url(#tierCard1)" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="42" y="90" width="176" height="22" rx="4" fill="#0C4A6E"/>
  <text x="52" y="105" class="tier-header" fill="#38BDF8">1. INGRESS &amp; EDGE</text>

  <!-- Node 1.1: Session Guard -->
  <rect x="42" y="125" width="176" height="52" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
  <text x="54" y="146" class="node-title">🛡️ sessionGuard</text>
  <text x="54" y="163" class="node-sub">MFA / AAL2 Physical Session</text>

  <!-- Node 1.2: RBAC Policy -->
  <rect x="42" y="190" width="176" height="52" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
  <text x="54" y="211" class="node-title">🔐 verifyPermission</text>
  <text x="54" y="228" class="node-sub">Granular RBAC Authorization</text>

  <!-- Node 1.3: Controller -->
  <rect x="42" y="255" width="176" height="52" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
  <text x="54" y="276" class="node-title">🎮 FinanceController</text>
  <text x="54" y="293" class="node-sub">Safe DTOs &amp; HTTP Status Map</text>

  <text x="50" y="365" class="flow-label">CLOUDFLARE WORKERS (86ms)</text>

  <!-- Connector 1 -> 2 -->
  <path d="M 230 200 L 260 200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="263,200 256,196 256,204" fill="#38BDF8"/>

  <!-- ================= TIER 2: APPLICATION CORE ================= -->
  <rect x="265" y="75" width="200" height="310" rx="10" fill="url(#tierCard2)" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="277" y="90" width="176" height="22" rx="4" fill="#1E3A8A"/>
  <text x="287" y="105" class="tier-header" fill="#60A5FA">2. APPLICATION CORE</text>

  <!-- Node 2.1: Orchestrator -->
  <rect x="277" y="125" width="176" height="52" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
  <text x="289" y="146" class="node-title">⚙️ Tx Orchestrator</text>
  <text x="289" y="163" class="node-sub">Distributed Idempotency Lease</text>

  <!-- Node 2.2: Plan Builder -->
  <rect x="277" y="190" width="176" height="52" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
  <text x="289" y="211" class="node-title">📐 PostingPlanBuilder</text>
  <text x="289" y="228" class="node-sub">Anti-Deadlock Lock Ordering</text>

  <!-- Node 2.3: Posting Authority -->
  <rect x="277" y="255" width="176" height="52" rx="6" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
  <text x="289" y="276" class="node-title">🏛️ PostingAuthority</text>
  <text x="289" y="293" class="node-sub">Gate 0 Sovereign Invariant Barrier</text>

  <text x="285" y="365" class="flow-label">CLEAN ARCH / ORCHESTRATION</text>

  <!-- Connector 2 -> 3 -->
  <path d="M 465 200 L 495 200" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="498,200 491,196 491,204" fill="#818CF8"/>

  <!-- ================= TIER 3: PURE DOMAIN (DDD) ================= -->
  <rect x="500" y="75" width="200" height="310" rx="10" fill="url(#tierCard3)" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="512" y="90" width="176" height="22" rx="4" fill="#3B0764"/>
  <text x="522" y="105" class="tier-header" fill="#C084FC">3. PURE DOMAIN (DDD)</text>

  <!-- Node 3.1: Ledger Transaction -->
  <rect x="512" y="125" width="176" height="52" rx="6" fill="#0E1026" stroke="#1E293B" stroke-width="1"/>
  <text x="524" y="146" class="node-title">📦 LedgerTransaction</text>
  <text x="524" y="163" class="node-sub">Immutable Aggregate Lifecycle</text>

  <!-- Node 3.2: Money256 -->
  <rect x="512" y="190" width="176" height="52" rx="6" fill="#0E1026" stroke="#1E293B" stroke-width="1"/>
  <text x="524" y="211" class="node-title">💰 Money256 uint256</text>
  <text x="524" y="228" class="node-sub">Zero-Float EVM-Grade Math</text>

  <!-- Node 3.3: Policies -->
  <rect x="512" y="255" width="176" height="52" rx="6" fill="#0E1026" stroke="#1E293B" stroke-width="1"/>
  <text x="524" y="276" class="node-title">📜 Domain Policies</text>
  <text x="524" y="293" class="node-sub">Custody &amp; Normal Balance (FIN-001)</text>

  <text x="525" y="365" class="flow-label">ISOLATED ENTERPRISE LOGIC</text>

  <!-- Connector 3 -> 4 -->
  <path d="M 700 200 L 730 200" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="733,200 726,196 726,204" fill="#10B981"/>

  <!-- ================= TIER 4: STORAGE & D1 ================= -->
  <rect x="735" y="75" width="185" height="310" rx="10" fill="url(#tierCard4)" stroke="#059669" stroke-width="1.5"/>
  <rect x="747" y="90" width="161" height="22" rx="4" fill="#064E3B"/>
  <text x="757" y="105" class="tier-header" fill="#34D399">4. ATOMIC STORAGE</text>

  <!-- Node 4.1: Atomic Posting Executor -->
  <rect x="747" y="125" width="161" height="52" rx="6" fill="#061A14" stroke="#1E293B" stroke-width="1"/>
  <text x="757" y="146" class="node-title">⚡ Atomic Executor</text>
  <text x="757" y="163" class="node-sub">Batch D1 SQL + Assertions</text>

  <!-- Node 4.2: Append-Only Ledger -->
  <rect x="747" y="190" width="161" height="52" rx="6" fill="#061A14" stroke="#1E293B" stroke-width="1"/>
  <text x="757" y="211" class="node-title">📖 Double-Entry Ledger</text>
  <text x="757" y="228" class="node-sub">Append-Only Immutable Rows</text>

  <!-- Node 4.3: Balances OCC -->
  <rect x="747" y="255" width="161" height="52" rx="6" fill="#061A14" stroke="#1E293B" stroke-width="1"/>
  <text x="757" y="276" class="node-title">⚖️ Balances (OCC)</text>
  <text x="757" y="293" class="node-sub">Materialized State + Version Lock</text>

  <text x="750" y="365" class="flow-label">CLOUDFLARE D1 (ACID BATCH)</text>

  <!-- Footer Info Line -->
  <g transform="translate(30, 412)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#64748B">
      <tspan fill="#34D399">✓</tspan> Strict Centripetal Dependencies • Dependency Inversion Principle (DIP) • Zero Circular Dependencies
    </text>
  </g>
</svg>
