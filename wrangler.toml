name = "w3-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = [ "nodejs_compat" ]

[vars]
FRONTEND_URL = "https://app.w3.com"
JWT_EXPIRE_IN = "24h"
SENDER_EMAIL = "suporte@w3.com"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Servir arquivos estáticos do Dashboard Frontend nativo
[assets]
directory = "public"

# ==============================================================
# Cloudflare Workers Configuration - TOP LEVEL
# ==============================================================

# Database
[[d1_databases]]
binding = "DB"
database_name = "w3-db"
database_id = "cfd0e171-f2b5-48d4-bf29-a9cf33d97b4d"
migrations_dir = "migrations"

# Storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "w3-media"

# Caching and Auth Speed (Nonces, Metrics)
[[kv_namespaces]]
binding = "KV_AUTH"
id = "5f8377a1e41d4869837debabbed2acfb"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "abb4df8656924422a3ccab4969e938d0"

[ai]
binding = "AI"

# --- EMAIL INFRASTRUCTURE ---

# R2 - Armazenamento Seguro de Anexos
[[r2_buckets]]
binding = "R2_EMAIL_ATTACHMENTS"
bucket_name = "w3-anexos"

# Queues - Producer
[[queues.producers]]
binding = "EMAIL_PIPELINE_QUEUE"
queue = "w3-mail"

# Queues - Consumer
[[queues.consumers]]
queue = "w3-mail"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "w3-mail-dlq"

# --- CHAT INFRASTRUCTURE ---

[[queues.producers]]
binding = "CHAT_PIPELINE_QUEUE"
queue = "w3-chat"

[[queues.consumers]]
queue = "w3-chat"
max_batch_size = 50
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "w3-chat-dlq"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoomDO"]
