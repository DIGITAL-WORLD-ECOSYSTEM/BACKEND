name = "asppibra-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = [ "nodejs_compat" ]

[vars]
FRONTEND_URL = "https://app.asppibra.com"
JWT_EXPIRE_IN = "24h"
SENDER_EMAIL = "suporte@asppibra.com"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Servir arquivos estáticos do Dashboard Frontend nativo (CSS, JS, Imagens, Mocks)
[assets]
directory = "public"

# ==============================================================
# Cloudflare Workers Configuration - TOP LEVEL
# ==============================================================

# Database
[[d1_databases]]
binding = "DB"
database_name = "gov-db"
database_id = "3640ec92-fb3c-4676-b9bc-174735fa3389"
migrations_dir = "migrations"

# Storage
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "socialfi"

# Caching and Auth Speed (Nonces, Metrics)
[[kv_namespaces]]
binding = "KV_AUTH"
id = "48d7f62733794b62b0a2c0f9049984e1"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "8a05d6f497e64e628fa34bde0622ffd4"

[ai]
binding = "AI"

# --- EMAIL INFRASTRUCTURE (FASE A) ---

# R2 - Armazenamento Seguro de Anexos
[[r2_buckets]]
binding = "R2_EMAIL_ATTACHMENTS"
bucket_name = "asppibra-email-attachments"

# Queues - Producer (Permite ao worker disparar eventos)
[[queues.producers]]
binding = "EMAIL_PIPELINE_QUEUE"
queue = "email-pipeline-queue"

# Queues - Consumer (Escuta os eventos do producer)
[[queues.consumers]]
queue = "email-pipeline-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "email-pipeline-dlq"

# --- CHAT INFRASTRUCTURE (FASE P1) ---

[[queues.producers]]
binding = "CHAT_PIPELINE_QUEUE"
queue = "chat-pipeline-queue"

[[queues.consumers]]
queue = "chat-pipeline-queue"
max_batch_size = 50
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "chat-pipeline-dlq"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoomDO"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoomDO"]

# ==============================================================
# ENVIRONMENTS
# ==============================================================

[env.production]
name = "asppibra-api"
routes = [
  { pattern = "api.asppibra.com", custom_domain = true }
]

[env.production.vars]
FRONTEND_URL = "https://app.asppibra.com"
JWT_EXPIRE_IN = "15m"
SENDER_EMAIL = "suporte@asppibra.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "gov-db"
database_id = "3640ec92-fb3c-4676-b9bc-174735fa3389"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "socialfi"

[[env.production.r2_buckets]]
binding = "R2_EMAIL_ATTACHMENTS"
bucket_name = "asppibra-email-attachments"

[[env.production.kv_namespaces]]
binding = "KV_AUTH"
id = "48d7f62733794b62b0a2c0f9049984e1"

[[env.production.kv_namespaces]]
binding = "KV_CACHE"
id = "8a05d6f497e64e628fa34bde0622ffd4"

[env.production.ai]
binding = "AI"

[[env.production.queues.producers]]
binding = "EMAIL_PIPELINE_QUEUE"
queue = "email-pipeline-queue"

[[env.production.queues.consumers]]
queue = "email-pipeline-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "email-pipeline-dlq"

[[env.production.queues.producers]]
binding = "CHAT_PIPELINE_QUEUE"
queue = "chat-pipeline-queue"

[[env.production.queues.consumers]]
queue = "chat-pipeline-queue"
max_batch_size = 50
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "chat-pipeline-dlq"

[[env.production.durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoomDO"

[env.staging]
name = "asppibra-api-staging"
[env.staging.vars]
FRONTEND_URL = "https://staging.app.asppibra.com"
JWT_EXPIRE_IN = "24h"
SENDER_EMAIL = "suporte@asppibra.com"

[[env.staging.kv_namespaces]]
binding = "KV_AUTH"
id = "mock-kv-auth-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "gov-db"
database_id = "3640ec92-fb3c-4676-b9bc-174735fa3389"
migrations_dir = "migrations"

